name: Docker

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pocke197/discord_bot
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar a Discord (exitoso)
        if: success() && github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"content\": \"Se ha construido y subido la imagen de Docker para el commit ${{ github.sha }} en la rama ${{ github.ref_name }}. Puedes ver los detalles en [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          $DISCORD_WEBHOOK_URL
      
      - name: Avisar a Discord (fallido)
        if: failure() && github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"content\": \"La construcción de la imagen de Docker ha fallado para el commit ${{ github.sha }} en la rama ${{ github.ref_name }}. Puedes ver los detalles en [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          $DISCORD_WEBHOOK_URL
