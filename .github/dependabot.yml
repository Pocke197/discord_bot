version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      dependencias:
        update-types: [minor, patch]